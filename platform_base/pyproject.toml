[project]
name = "platform-base"
version = "2.0.0"
description = "Platform Base: exploratory time-series analysis for irregular sensor data (PyQt6 Desktop)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "PyQt6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "pyvista>=0.42.0",
    "pyvistaqt>=0.11.0",
    "pydantic>=2.0.0",
    "pint>=0.21.0",
    "structlog>=23.1.0",
    "joblib>=1.2.0",
    "numba>=0.57.0",
    "pyarrow>=12.0.0",
    "openpyxl>=3.1.0",
    "h5py>=3.8.0",
    "tables>=3.8.0",
    "python-dateutil>=2.8.0",
    "psutil>=5.9.0",
    "toml>=0.10.0",
    "PyYAML>=6.0.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-qt>=4.3.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.75.0",
    "ruff>=0.1.0",
    "mypy>=1.3.0",
    "bandit>=1.7.0",
    "sphinx>=6.2.0",
    "sphinx-rtd-theme>=1.2.0",
    "memory_profiler>=0.61.0",
]
viz = [
    "opencv-python>=4.7.0",
    "moviepy>=1.0.3",
    "vtk>=9.2.0",
    "matplotlib>=3.6.0",
]
ml = [
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
]
dist = [
    "pyinstaller>=5.13.0",
    "cx_Freeze>=6.15.0",
]

[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ============================================
# RUFF - Linting e Formatação
# ============================================
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # pylint
    "RUF",    # Ruff-specific
    "N",      # pep8-naming
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C90",    # mccabe complexity
    "DJ",     # flake8-django
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "INP",    # flake8-no-pep420
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SLOT",   # flake8-slots
    "TID",    # flake8-tidy-imports
    "INT",    # flake8-gettext
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "FLY",    # flynt
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "TRY",    # tryceratops
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "S101",   # use of assert (allowed in tests)
    "T201",   # print found (we use logging mostly)
    "TD003",  # missing issue link in TODO
    "FIX002", # line contains TODO
    "ERA001", # commented out code (will fix later)
    "TRY003", # long messages outside exception class
    "EM101",  # exception string literal
    "EM102",  # exception f-string literal
    "BLE001", # blind except Exception (intentional catch-all in many places)
    "TRY002", # raise vanilla Exception
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "C901",   # too complex (handled by mccabe)
    "SLF001", # private member access (needed for Qt internals)
    "N802",   # invalid function name (Qt uses camelCase)
    "N803",   # invalid argument name (Qt uses camelCase)
    "N801",   # invalid class name
    "N806",   # non-lowercase variable
    "G004",   # logging f-string (acceptable for structured logging)
    "PLC0415", # import outside top-level (lazy imports are intentional)
    "TRY300", # try-consider-else
    "TRY301", # raise-within-try
    "TRY401", # verbose-log-message
    "PTH123", # builtin-open (pathlib not always practical)
    "A002",   # builtin-argument-shadowing
    "S110",   # try-except-pass (intentional in many cases)
    "SIM102", # collapsible-if (readability preference)
    "INP001", # implicit-namespace-package (not using PEP420)
    # Additional relaxations for CI stability
    "ARG001", # unused-function-argument (Qt callbacks)
    "ARG002", # unused-method-argument (Qt callbacks)
    "ARG005", # unused-lambda-argument
    "PLW0603", # global-statement
    "RUF001", # ambiguous-unicode-character-string (Portuguese chars)
    "RUF012", # mutable-class-default
    "PERF401", # manual-list-comprehension
    "B904",   # raise-without-from-inside-except
    "B007",   # unused-loop-control-variable
    "B008",   # function-call-in-default-argument
    "PLR0911", # too-many-return-statements
    "E741",   # ambiguous-variable-name (short vars in math)
    "ISC002", # multi-line-implicit-string-concatenation
    "PTH107", # os-remove
    "PTH110", # os-path-exists
    "PTH104", # os-rename
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp
    "N815",   # mixed-case-variable-in-class-scope
    "N817",   # camelcase-imported-as-acronym
    "S301",   # suspicious-pickle-usage (internal cache)
    "S311",   # suspicious-non-cryptographic-random-usage
    "S112",   # try-except-continue
    "TRY004", # type-check-without-type-error
    "G201",   # logging-exc-info
    "PLC0206", # dict-index-missing-items
    "S105",   # hardcoded-password-string (false positives)
    "S607",   # start-process-with-partial-path
    "E402",   # module-level-import-not-at-top
    "F404",   # late-future-import
    "F601",   # multi-value-repeated-key-literal
    "A001",   # builtin-variable-shadowing (filter, type, etc)
    "SIM117", # multiple-with-statements (readability choice)
    "PTH108", # os-unlink (pathlib not always available)
    "S108",   # hardcoded-temp-file (tests use /tmp)
    "PT015",  # pytest-assert-always-false
    "B011",   # assert-false
    "B017",   # assert-raises-exception
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import (Pydantic needs runtime types)
    "E722",   # bare-except (intentional in fault handlers)
    "UP035",  # deprecated-import (asyncio polyfill)
    "UP038",  # non-pep604-isinstance
    "RET504", # unnecessary-assign (readability)
    "RET505", # superfluous-else-return (readability)
    "E712",   # true-false-comparison (numpy bool required)
    "TRY400", # error-instead-of-exception
    "RUF015", # unnecessary-iterable-allocation-for-first-element
    "PERF102", # incorrect-dict-iterator
    "C414",   # unnecessary-double-cast-or-process
    "PTH101", # os-chmod
    "PTH118", # os-path-join
    "PTH120", # os-path-dirname
    "S314",   # suspicious-xml-element-tree-usage
    "SIM222", # expr-or-true
    "E731",   # lambda-assignment
    "RUF013", # implicit-optional
    "PLR1722", # sys-exit-alias
    "RUF005", # collection-literal-concatenation
    "RUF022", # unsorted-dunder-all
    "S603",   # subprocess-without-shell-equals-true
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # use of assert
    "ARG",     # unused arguments
    "PLR2004", # magic values
    "PLR0913", # too many arguments
    "SLF001",  # private member access
    "PT",      # pytest style (more flexible in tests)
    "F401",    # unused-import (test availability checks)
]
"__init__.py" = ["F401", "F403"]
"**/examples/**/*.py" = ["T201", "INP001"]  # print allowed in examples
"**/scripts/**/*.py" = ["T201", "INP001"]   # print allowed in scripts
"**/core/config*.py" = ["F401"]  # Optional imports in try/except blocks
"**/core/registry.py" = ["F401", "F402"]  # Loop variable shadows import
"**/ui/*.py" = ["F401"]  # Optional dependency imports
"**/viz/*.py" = ["F401"]  # Optional dependency imports
"**/streaming/*.py" = ["F401"]  # Optional dependency imports
"**/desktop/**/*.py" = ["F401"]  # Optional dependency imports
"**/plugins/**/*.py" = ["F401"]  # Optional dependency imports
"launch_app.py" = ["F401"]  # Optional dependency imports
"test*.py" = ["F401"]  # Test import checks

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["platform_base"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================
# MYPY - Type Checking
# ============================================
[tool.mypy]
python_version = "3.12"
strict = false  # Relaxed for gradual adoption
warn_return_any = false  # Allow Any returns during migration
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing
disallow_incomplete_defs = false
check_untyped_defs = false  # Don't check untyped code
no_implicit_optional = false  # Allow implicit Optional
warn_redundant_casts = false  # Too noisy
warn_unused_ignores = false  # Can be noisy during refactoring
show_error_codes = true
show_column_numbers = true
pretty = true
ignore_missing_imports = true  # For third-party packages
disable_error_code = [
    "has-type",       # Cannot determine type
    "return-value",   # Incompatible return value (singletons)
    "arg-type",       # Incompatible argument type
    "union-attr",     # Union attribute access
    "no-any-return",  # Allow Any returns
    "assignment",     # Assignment type mismatch
    "call-arg",       # Call argument issues
    "misc",           # Miscellaneous errors
    "attr-defined",   # Attribute not defined
    "annotation-unchecked", # Unchecked annotation
    "var-annotated",  # Variable annotation issues
    "override",       # Method override issues
    "operator",       # Operator issues
    "call-overload",  # Overload issues
    "type-arg",       # Type argument issues
    "index",          # Index issues
    "name-defined",   # Name defined issues
    "no-redef",       # No redefine issues
    "dict-item",      # Dict item type issues
    "valid-type",     # PEP 695 generics
]

[[tool.mypy.overrides]]
module = [
    "pyqtgraph.*",
    "pyvista.*",
    "pyvistaqt.*",
    "numba.*",
    "joblib.*",
    "structlog.*",
    "pint.*",
    "tables.*",
    "h5py.*",
]
ignore_missing_imports = true

# ============================================
# BANDIT - Security
# ============================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist", "examples", "scripts"]
skips = [
    "B101",  # assert used in tests
    "B301",  # pickle used for internal cache (trusted data)
    "B311",  # random not for crypto (we use it for non-security purposes)
    "B324",  # MD5 used for cache hashing, not security
    "B404",  # subprocess module (needed for system integration)
    "B603",  # subprocess without shell=True (false positives)
]

# ============================================
# PYTEST - Testing
# ============================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: smoke tests (critical path tests)",
    "unit: unit tests",
    "integration: integration tests",
    "gui: GUI tests requiring Qt",
    "e2e: end-to-end tests",
    "performance: performance benchmark tests",
    "stress: stress/load tests",
    "property: property-based tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::UserWarning",
    "ignore:.*CUDA.*:UserWarning",
]
qt_api = "pyqt6"

# ============================================
# COVERAGE - Code Coverage
# ============================================
[tool.coverage.run]
source = ["src/platform_base"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.paths]
source = ["src/platform_base"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "pass",
    "\\.\\.\\.",
]
fail_under = 70
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
